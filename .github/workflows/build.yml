name: jarvis_ai
description: Jarvis AI - Local Device Intelligence

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Encryption
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  
  # HTTP for AI API
  http: ^1.2.2
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Speech
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  
  # Shared prefs
  shared_preferences: ^2.3.2
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
  assets/
  
