name: Build Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create assets directory
        run: mkdir -p assets

      - name: Get dependencies
        run: flutter pub get


      - name: Find legacy Android embedding plugins
        shell: bash
        run: |
          echo "Checking Flutter plugins..."

          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          file = Path(".flutter-plugins-dependencies")
          if not file.exists():
              print("Plugin dependency file not found")
              raise SystemExit(0)

          data = json.loads(file.read_text())
          plugins = data.get("plugins", {}).get("android", [])

          patterns = [
              r"io\.flutter\.app",
              r"PluginRegistry\.Registrar",
              r"registerWith\s*\("
          ]

          for plugin in plugins:
              name = plugin.get("name", "unknown")
              root = Path(plugin.get("path", "")) / "android" / "src" / "main"

              print(f"\nPLUGIN: {name}")

              if not root.exists():
                  continue

              for source in root.rglob("*"):
                  if source.suffix not in (".java", ".kt"):
                      continue

                  try:
                      lines = source.read_text(errors="ignore").splitlines()
                      for number, line in enumerate(lines, 1):
                          if any(re.search(p, line) for p in patterns):
                              print(f"LEGACY: {source}:{number}: {line.strip()}")
                  except Exception:
                      pass
          PY

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi -v

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
